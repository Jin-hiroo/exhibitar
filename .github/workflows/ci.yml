# Runs on every pull request and every push to main. Deploys are not done here:
# Vercel's Git integration builds a preview for each branch and deploys main to
# production. The `main` ruleset requires these jobs to pass before a PR merges,
# so renaming a job (its `name:`) means updating the ruleset too.
#
# Third-party actions are pinned to a commit SHA; Dependabot bumps them.

name: CI

on:
  pull_request:
    # `edited` so that changing a PR's base branch (e.g. a stacked PR retargeted to main) reruns
    # CI against the new base. Don't filter it to base changes with a job `if:`: a title edit
    # would then cancel a running check and replace it with a skipped one, which counts as passed.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per PR (a new push cancels the old run). Pushes to main each get their own group,
  # so every main commit gets a result.
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from package.json packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # same major as the Vercel project (Node 24.x)
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test

  e2e:
    name: Build and e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Headless shell only: the tests never run headed. Not cached; Playwright advises against it.
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      # No Supabase env: the app runs signed-out, which is what the e2e tests cover.
      - run: pnpm build
      # With CI set, playwright.config.ts serves this build with `next start`.
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  migrations:
    # CONTRIBUTING: database changes go in a new migration file; never edit an applied one.
    # Migrations are applied to Supabase by hand, so CI only guards the history.
    name: Migrations unchanged
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # the PR's test merge commit and its first parent (the base branch)
          persist-credentials: false
      - name: Fail if an existing migration was edited, renamed or deleted
        run: |
          changed=$(git diff --no-renames --name-only --diff-filter=DMT HEAD^1 HEAD -- 'supabase/migrations/*.sql')
          if [ -n "$changed" ]; then
            for f in $changed; do
              echo "::error file=$f::Existing migrations must not change. Add a new file in supabase/migrations/ instead."
            done
            exit 1
          fi
          echo "No existing migration changed."
